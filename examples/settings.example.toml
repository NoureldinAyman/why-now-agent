# Example settings for the Why-Now Agent. Every setting is listed here with its default.
# Copy this file, change what you need, and pass it to the `why-now` command.
# Any setting can also be set in the environment with a WHY_NOW_ prefix,
# for example WHY_NOW_SHORT_LIST_SIZE=5. Lists and tables are written as JSON there,
# and replace the whole list or table from this file rather than adding to it.
# Every WHY_NOW_ variable must be a real setting name, so a misspelt one is refused.
# The design's "Every number, and why" table says where each number comes from.

# Where the workspace lives: "local" for a folder, "aws" for S3 and DynamoDB.
deployment = "local"
# The workspace folder, kept out of Git. Everything a run produces goes here.
workspace_path = "workspace"
# Ids of the profiles the night run works for. Upload a profile first: why-now profile upload FILE.
nightly_profiles = []
# Public results pages. Off by default, and only public profiles are ever shown.
public_results_enabled = false

# Most companies on the short list each day, to protect the reviewer's time.
short_list_size = 10
# Days a decided company stays hidden, so it is not reviewed again too soon.
hide_days = 90
# A company needs a new ad within this many days to have a why-now reason.
new_ad_days = 14
# Companies researched a day, to stay inside the budget.
research_per_day = 12
# Most research steps per company, limiting cost and how far a page can lead the agent.
research_steps = 5
# Newest relevant ads read per company. The total count is always given as well.
newest_ads_read = 5
# Extra companies a change must get right on the check pile to be kept.
keep_min_gain = 2
# Tries allowed against one check pile before it is worn out.
tries_per_check_pile = 50
# New check companies needed after those tries before more are made.
new_check_companies = 25
# Most tries in one improvement run.
tries_per_run = 3

# Companies in the practice pile.
practice_size = 45
# Companies in the check pile.
check_size = 45
# Companies in the final pile.
final_size = 45
# Companies marked first, to learn the share of yes answers early.
pilot_size = 40
# Companies "Prepare" picks and researches at a time, about one short marking sitting.
prepare_batch = 20
# Characters of a company page shown on the marking card. The full pack is one tap away.
card_page_chars = 400
# Researched companies judged no shown on the review page, closest to a yes first.
judged_no_shown = 3
# Whether test case packs get web research. Off, they hold job ads only and cost nothing.
test_case_web_research = false
# Companies a profile preview lists, with the most relevant ads first. The total is always shown.
preview_companies = 20
# Careers pages per job source that "Run now" reads at random, so it ends in minutes.
run_now_sample_boards = 50
# Short reasons the reviewer can tap in place of writing a sentence.
reason_chips = [
  "recruitment agency",
  "competitor",
  "not hiring the right people",
  "too big",
  "too small",
  "good timing",
]
# Most letters in one reason choice, so it stays short enough to tap.
reason_chip_max_chars = 40
# The smallest and largest value the settings page may store for each setting it can change. For reason_chips, the fewest and most choices.
editable_limits = { short_list_size = [1, 30], hide_days = [1, 365], judged_no_shown = [0, 10], prepare_batch = [1, 100], reason_chips = [1, 12] }
# Most companies the reviewer is asked to mark.
marking_ceiling = 500
# Companies marked a second time, to measure the reviewer's consistency.
remark_size = 30
# Times each question is asked again, with no saved answers, to see how much answers move.
consistency_asks = 5
# Practice packs the consistency check asks about.
consistency_packs = 20
# Days to wait before re-marking, so the first answers are not remembered.
remark_after_days = 7
# Yes answers wanted in each pile.
target_yes_per_pile = 15
# Fewest yes answers a pile may have.
floor_yes_per_pile = 15

# Seconds between requests to the same job source.
request_delay_seconds = 1.0
# Share of a source's boards that must fail at once to count as an outage.
outage_share = 0.9
# Days a page must keep failing before it is set aside.
dead_after_days = 7
# Days before a page that was set aside is tried again.
retry_dead_after_days = 30
# Tries per request when a job source says it is busy or asks us to slow down.
request_attempts = 3
# Longest pause a job source may ask for. Asked for more, the page is counted as failed.
max_retry_wait_seconds = 60
# Seconds to wait for a job source to answer one request.
source_timeout_seconds = 30

# Monthly spending limit in US dollars. Paid calls stop here.
budget_limit_usd = 70
# Monthly spending in US dollars at which a warning is shown.
budget_warning_usd = 50
# Part of the monthly limit the improvement loop may spend.
loop_budget_usd = 25
# Fixed monthly costs with no per-call meter, such as hosting, counted towards the limit.
fixed_monthly_costs_usd = 0
# Langfuse units a month after which company traces are thinned.
langfuse_thin_at_units = 40000

# Probability a company needs in the quick look to be researched.
quick_look_pass = 0.3
# Probability a required question needs for a yes.
required_pass = 0.5
# Gap between the cut-offs tried when choosing one on the practice pile.
cutoff_step = 0.1
# Strength a company needs for a yes before a cut-off has been chosen on the practice pile.
default_cutoff = 0.5
# Weighting of the score: 1 gives F1, which counts a missed company as much as a wrong yes.
# Fixed before marking starts, the same for every profile, and recorded with every score.
score_beta = 1

# Largest page the page reader will download, in bytes.
max_page_bytes = 2000000
# Seconds the page reader waits for a page.
page_timeout_seconds = 15
# Most redirects the page reader follows for one page.
max_redirects = 5
# Most characters of one job ad passed to a model.
max_ad_chars = 20000
# Most characters in one evidence pack.
max_pack_chars = 60000
# Most characters in one brief.
brief_max_chars = 1200
# Most words in a row a proposed rule may copy from an ad.
screen_max_copied_words = 8
# Most words in the reason given for a proposed rule.
screen_max_why_words = 20
# Most ads shown with each mistake when asking for a change.
mistake_ads = 3
# Most characters of each of those ads.
mistake_ad_chars = 300

# The settings below are only used when deployment = "aws". Names come from the AWS setup.
# Secrets are never set here: they come from the environment or from Parameter Store.
# AWS region, such as "eu-central-1".
aws_region = ""
# S3 bucket for job ads, evidence packs and other large documents.
aws_bucket = ""
# DynamoDB table for every other record.
aws_table = ""
# Where secrets live in Parameter Store, such as /why-now/session-secret.
aws_parameter_prefix = "/why-now"
# Documents larger than this many bytes go to S3, under DynamoDB's 400 KB record limit.
aws_inline_max_bytes = 350000
# Address of the Cognito sign-in page, such as "https://<name>.auth.<region>.amazoncognito.com".
cognito_domain = ""
# Cognito user pool, such as "eu-central-1_AbCdEf123".
cognito_user_pool_id = ""
# Cognito login client. Left empty, it is read from Parameter Store at start-up.
cognito_client_id = ""
# Most copies of the web page that may run at once. A cap on what a flood of requests can cost.
# 0 reserves none, for an account whose AWS limit is too low to reserve any.
aws_web_max_copies = 2
# Seconds one web page request may take before AWS stops it.
aws_web_timeout_seconds = 30
# Memory in megabytes for the web page. More memory also gives more computing power.
aws_web_memory_mb = 1024
# CPU for the daily run on AWS, in units where 1024 is one virtual CPU.
aws_run_cpu = 1024
# Memory in megabytes for the daily run on AWS.
aws_run_memory_mb = 2048
# Hour of the day, in UTC, when the daily run starts on AWS.
aws_run_hour_utc = 2
# The cluster the review page starts a run in. Set by the AWS setup, not by hand.
aws_run_cluster = ""
# The one task definition the review page may start. Set by the AWS setup.
aws_run_task = ""
# The container in that task whose command the page sets.
aws_run_container = "Run"
# The subnets a run started from the page uses. Set by the AWS setup.
aws_run_subnets = []
# The firewall a run started from the page uses. Set by the AWS setup.
aws_run_security_groups = []
# Hours before a run that started and never finished shows as stopped and stops blocking the next.
run_stale_hours = 12
# Runs the Runs page lists.
runs_shown = 10
# Time zone name the review page shows times in, such as "Europe/Berlin". The schedule is in UTC.
display_timezone = "UTC"
# Days a log is kept before AWS deletes it.
aws_log_retention_days = 14
# Zones the AWS network spans, one public subnet in each.
aws_network_zones = 2
# Hours a sign-in lasts before signing in again.
session_hours = 12
# Minutes allowed to finish signing in on Cognito's page.
login_minutes = 10
# Fewest characters the session secret may have.
session_secret_min_chars = 32

# Model used for research.
research_model = "claude-sonnet-5-5"
# Model that writes briefs.
writer_model = "claude-sonnet-5-5"
# Model for the quick look.
quick_look_model = "jev-1.14.0"
# Model for the quick look when there is no Jev key.
quick_look_fallback_model = "claude-haiku-5-5"
# Model that judges each evidence pack.
judge_model = "claude-sonnet-5-5"
# The two judges the comparison runs on the check pile. Only two, so the check pile is not
# fitted by choosing among many. With no Jev key a Jev entry becomes the quick look fallback.
judge_candidates = ["jev-1.14.0", "claude-sonnet-5-5"]
# Effort is low, medium or high: more thinks harder and costs more. Changing
# one asks the saved questions again. Tune effort on the practice pile only.
# Effort for the quick look, used only when it falls back to Claude.
quick_look_effort = "low"
# Effort for research.
research_effort = "medium"
# Effort for the judge.
judge_effort = "medium"
# Effort for writing briefs.
writer_effort = "medium"
# Effort for proposing rule changes in the improvement loop.
proposer_effort = "high"
# Most tokens one Claude call may write, so a call finishes inside the library's time limit.
model_max_output_tokens = 16000

# Careers page lists, one JSON list of page names per job source. To start with the example list:
# greenhouse = "examples/boards.greenhouse.example.json"
[board_lists]

# Prices in US dollars per model, used by the budget meter. Checked on 6 Nov 2026.
# A model with no price here is refused, so every call can be costed.
[prices]

# Claude Sonnet 5.5, per million tokens, plus each web search ($10 per 1,000).
[prices.claude-sonnet-5-5]
input_per_million_usd = 2
output_per_million_usd = 10
per_search_usd = 0.01

# Claude Haiku 5.5, per million tokens, for prompts up to 100,000 tokens.
[prices.claude-haiku-5-5]
input_per_million_usd = 0.1
output_per_million_usd = 0.5
per_search_usd = 0

# Jev 1.14.0, per million tokens. Jev charges for input tokens only.
[prices."jev-1.14.0"]
input_per_million_usd = 0.042
output_per_million_usd = 0
per_search_usd = 0
